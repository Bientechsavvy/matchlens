[project]
name = "matchlens"
version = "0.1.0"
description = "Explainable football match intelligence from synthetic events"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.5", "fastapi>=0.110", "uvicorn>=0.27", "websockets>=12"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]
azure = ["azure-identity", "openai>=1.40"]
agents = ["agent-framework-core>=1.20"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
ignore = ["E501", "BLE001"]
